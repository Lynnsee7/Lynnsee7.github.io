<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="CoSQA+ : a multi-choice code search benchmark">
  <defs>
    <linearGradient id="cosqaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dbe7fb"/>
    </linearGradient>
    <style>
      .f { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#cosqaBg)"/>
  <rect x="0" y="0" width="800" height="10" fill="#00369f"/>

  <g opacity="0.13" stroke="#00369f" stroke-width="2" fill="none">
    <circle cx="655" cy="150" r="46"/>
    <line x1="688" y1="183" x2="730" y2="225"/>
    <path d="M70 348 h660"/>
  </g>

  <text class="f" x="70" y="210" font-size="86" font-weight="700" fill="#0b1d3a">CoSQA<tspan fill="#00369f">+</tspan></text>
  <text class="f" x="72" y="262" font-size="27" font-weight="500" fill="#33415c">Multi-Choice Code Search Benchmark</text>
  <text class="f" x="72" y="302" font-size="27" font-weight="500" fill="#33415c">with Test-Driven Agents</text>

  <g class="f" font-size="24" fill="#43516b">
    <text x="72" y="404">412,080 query-code pairs</text>
    <text x="72" y="444">93.0% annotation accuracy</text>
  </g>
</svg>
