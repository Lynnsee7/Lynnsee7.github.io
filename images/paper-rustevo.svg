<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="RustEvo2 : an evolving benchmark for API evolution in Rust code generation">
  <defs>
    <linearGradient id="rustBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf1e7"/>
      <stop offset="100%" stop-color="#f7ddc8"/>
    </linearGradient>
    <style>
      .f { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#rustBg)"/>
  <rect x="0" y="0" width="800" height="10" fill="#b7410e"/>

  <g opacity="0.16" stroke="#b7410e" stroke-width="3" fill="none">
    <path d="M613 126 h40 M679 126 h40"/>
    <circle cx="600" cy="126" r="13"/>
    <circle cx="666" cy="126" r="13"/>
    <circle cx="732" cy="126" r="13"/>
    <path d="M70 348 h660"/>
  </g>

  <text class="f" x="70" y="210" font-size="86" font-weight="700" fill="#3d1c08">RustEvo<tspan font-size="52" dy="-26" fill="#b7410e">2</tspan></text>
  <text class="f" x="72" y="262" font-size="27" font-weight="500" fill="#5a3418">An Evolving Benchmark for API Evolution</text>
  <text class="f" x="72" y="302" font-size="27" font-weight="500" fill="#5a3418">in LLM-based Rust Code Generation</text>

  <g class="f" font-size="24" fill="#6b4526">
    <text x="72" y="404">Pass@1 drops 17.6% on evolved APIs</text>
    <text x="72" y="444">RAG recovers ~60% of the loss</text>
  </g>
</svg>
